<svg
  width="260"
  height="64"
  viewBox="0 0 260 64"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- ICON -->
  <g transform="translate(16, 14)">
    <!-- Top tier -->
    <g>
      <animateTransform
        attributeName="transform"
        type="scale"
        values="1;1.05;1"
        dur="2.4s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="opacity"
        values="0.92;1;0.92"
        dur="2.4s"
        repeatCount="indefinite"
      />
      <image href="data:image/webp;base64," x="0" y="0" width="56" height="14" preserveAspectRatio="none" />
    </g>

    <!-- Middle tier -->
    <g>
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;3.5 0;0 0"
        dur="2.4s"
        begin="0.2s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="opacity"
        values="0.85;1;0.85"
        dur="2.4s"
        begin="0.2s"
        repeatCount="indefinite"
      />
      <image href="data:image/webp;base64," x="0" y="12" width="56" height="10" preserveAspectRatio="none" />
    </g>

    <!-- Bottom tier -->
    <g>
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;2 0;0 0"
        dur="2.4s"
        begin="0.4s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="opacity"
        values="0.75;0.95;0.75"
        dur="2.4s"
        begin="0.4s"
        repeatCount="indefinite"
      />
      <image href="data:image/webp;base64," x="0" y="21" width="56" height="11" preserveAspectRatio="none" />
    </g>
  </g>

  <!-- TEXT -->
  <text
    x="92"
    y="38"
    font-size="22"
    font-family="Inter, system-ui, sans-serif"
    font-weight="600"
    fill="#F2F2F2"
    letter-spacing="0.5"
  >
    BookStrata
  </text>
</svg>
