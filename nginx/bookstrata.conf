# ============================================================
# BookStrata — Nginx config (production, HTTPS)
# ============================================================
# Auto-renewal: certbot renew
# ============================================================

# Docker DNS resolver для динамического обновления IP upstream
resolver 127.0.0.11 ipv6=off valid=10s;

# Определяем заголовок Connection в зависимости от Upgrade
map $http_upgrade $connection_upgrade {
    default  upgrade;
    ''       "";
}

# Gzip сжатие для статики и API
gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    image/x-icon
    font/woff
    font/woff2
    application/manifest+json;

upstream backend {
    # Бэкенд в Docker-контейнере
    server app:8080;
    keepalive 32;
}

# ———— Медиа-кэш: раздача /img/{key} из S3 ————
# Картинки лежат в S3-бакете, но отдаются через собственный домен
# (raw-S3-хост недоступен части клиентов из-за VPN/гео; CDN отключён).
# Дисковый кэш убирает поход в S3 на большинстве запросов.
proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:10m max_size=2g inactive=30d use_temp_path=off;

# Заголовок кэширования для медиа: отдаём долгий кэш только для успешных
# ответов, ошибки (403 от S3 на отсутствующий ключ) — no-store, иначе битая
# картинка залипнет в браузере на год.
# Именно $status (итоговый код ответа), а не $upstream_status: при отдаче
# из дискового кэша upstream-запрос не выполняется и $upstream_status пуст.
map $status $media_cache_control {
    default   "no-store";
    200       "public, max-age=31536000, immutable";
}

# ———— HTTP: ACME-проверки Let's Encrypt + редирект на HTTPS ————
# Certbot продлевает сертификаты через webroot (--webroot -w nginx/certbot),
# challenge-файлы отдаются из /var/www/certbot (маунт в docker-compose), без остановки nginx.
# ACME-location для status.bookstrata.ru — в status.conf (не дублировать здесь:
# одинаковый server_name на :80 в двух файлах = "duplicate server name", nginx не стартует)
server {
    listen 80;
    server_name bookstrata.ru www.bookstrata.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://bookstrata.ru$request_uri;
    }
}

# ———— HTTPS: www → bookstrata.ru ————
server {
    listen 443 ssl;
    http2 on;
    server_name www.bookstrata.ru;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    return 301 https://bookstrata.ru$request_uri;
}

# ———— HTTPS ————
server {
    listen 443 ssl;
    http2 on;
    server_name bookstrata.ru;

    # SSL-сертификаты
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Базовая безопасность
    server_tokens off;
    client_max_body_size 15M;

    # Security-заголовки (default для locations без своего add_header).
    # Locations со своим Cache-Control должны подключать этот snippet явно,
    # т.к. свой add_header сбрасывает наследование.
    include /etc/nginx/snippets/security-headers.conf;

    # Настройки SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Статика (собранный фронтенд)
    root /usr/share/nginx/html;
    index index.html;

    # Кэширование статики (Vite-сборка с хэшами в именах)
    location /assets/ {
        # Fallback на старые чанки (предыдущий dist.old) при деплое
        try_files $uri @old_assets;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # JS/MJS модули — явно указываем MIME тип,
    # чтобы при отсутствии файла nginx не отдавал index.html как JS
    location ~* \.(js|mjs)$ {
        types { } default_type "application/javascript; charset=utf-8";
        try_files $uri @old_assets;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Fallback на предыдущую сборку (dist.old) — старые JS-чанки
    location @old_assets {
        root /usr/share/nginx/old-assets;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Скриншоты для лендинга
    location /screenshots/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Изображения (webp, png, jpg, svg, ico)
    location ~* \.(webp|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Раздача изображений из S3 через собственный домен: nginx проксирует
    # /img/{key} → s3.twcstorage.ru/bookstrata/{key} и кэширует на диск.
    # ^~ обязателен — иначе regex-локация выше (\.webp|\.png) перехватит запрос.
    location ^~ /img/ {
        set $s3_origin https://s3.twcstorage.ru;

        # guard: nginx нормализует «../» в URI до выбора location, но
        # закодированные варианты не декодирует — такое в S3 не отправляем
        if ($uri ~ "\.\.") {
            return 400;
        }

        rewrite ^/img/(.*)$ /bookstrata/$1 break;
        proxy_pass $s3_origin;
        proxy_ssl_server_name on;
        proxy_set_header Host s3.twcstorage.ru;

        proxy_cache media;
        proxy_cache_key $uri;          # без $args: query-строка — артефакт старого CDN
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;           # параллельные запросы одной картинки — один поход в S3
        proxy_ignore_headers Cache-Control Set-Cookie;
        proxy_hide_header Cache-Control;  # свой Cache-Control задаём ниже (иначе два заголовка)

        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control $media_cache_control always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Шрифты — кэшируем навсегда (имена стабильны, не хэшированы)
    location ~* \.(woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Видео (mp4)
    location ~* \.(mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    location /uploads/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RSS-фид — проксируется на бэкенд (роут /rss.xml, без /api префикса)
    location = /rss.xml {
        expires 1d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # = = = SPA-роуты = = =
    # Для известных маршрутов — отдаём index.html с 200 (SPA рендерит страницу).
    # Для неизвестных путей — HTTP 404 (Яндекс не индексирует мусор).

    # Профили пользователей — не индексируем: SPA без prerender, дефолтные мета-теги.
    # X-Robots-Tag применяется и к fallback-ответу (add_header из location сохраняется
    # при internal redirect try_files). ^~ имеет приоритет над regex-локацией ниже.
    location ^~ /users/ {
        try_files $uri /spa-index.html =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=86400";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /users {
        try_files $uri /spa-index.html =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=86400";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Корень сайта
    location = / {
        try_files /index.html /spa-index.html =404;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=86400";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Единый канон: публичные маршруты — без хвостового слэша.
    # Слэш-дубли (/collections/x/ и /collections/x) давали Google «копии»
    # и canonical-расхождения — теперь /collections/x/ → 301 /collections/x.
    location ~ ^/(community|rankings|forum|about|pricing|contact|privacy|terms|templates|what-to-read|history|collections|tier-lists|news|auth|topics|celebrities|blog|faq|shelf|authors)(/.*)?/$ {
        rewrite ^(.*)/$ $1 permanent;
    }

    # Пререндеренные разделы: коллекции/топики/знаменитости создаёт только админ,
    # деплой идёт сразу после публикации, поэтому пререндер-файл гарантирован.
    # Несуществующий slug → 404 (Google не индексирует мусорные 200-копии).
    location ^~ /collections/ {
        rewrite ^(.*)/$ $1 permanent;
        try_files $uri/index.html $uri =404;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=86400";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ^~ /topics/ {
        rewrite ^(.*)/$ $1 permanent;
        try_files $uri/index.html $uri =404;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=86400";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ^~ /celebrities/ {
        rewrite ^(.*)/$ $1 permanent;
        try_files $uri/index.html $uri =404;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=86400";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Список знаменитостей (без слэша) — пререндеренная страница, отдельно от ^~ /celebrities/
    location = /celebrities {
        try_files /celebrities/index.html =404;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=86400";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Авторы: пререндер-файл ($uri/index.html), иначе SPA-каркас — как tier-lists.
    # Пока author-routes пуст, страницы рендерятся на клиенте; после преренда отдаётся статика.
    location ~ ^/authors($|/) {
        rewrite ^(.*)/$ $1 permanent;
        try_files $uri/index.html $uri /spa-index.html =404;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=86400";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Публичные пререндеренные маршруты с SPA-фолбэком.
    # tier-lists/{slug} — пользовательский контент, создаётся без деплоя:
    # fallback на SPA-каркас, чтобы свежие тир-листы не отдавали 404.
    # Приоритет: 1) пререндер-файл $uri/index.html, 2) точный файл $uri, 3) SPA-каркас
    location ~ ^/(community|rankings|forum|about|pricing|contact|privacy|terms|templates|what-to-read|history|tier-lists|news|auth|blog|faq|shelf)($|/) {
        rewrite ^(.*)/$ $1 permanent;
        try_files $uri/index.html $uri /spa-index.html =404;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=86400";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Страницы книг /books/{slug} (Фаза 6, seobook.md):
    # 1) пререндер-файл $uri/index.html — отдаётся статикой (быстро, без бэкенда),
    # 2) иначе — прокси на Fastify: там lookup BookSlugHistory → 301 на актуальный
    #    slug, либо SEO-фолбэк (meta из БД + spa-каркас) для непререндеренных книг,
    #    либо 404 (noindex) для неизвестных/draft.
    location ^~ /books/ {
        try_files $uri/index.html $uri @books_backend;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=86400";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location @books_backend {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Приватные SPA-роуты (не пререндерятся, не кэшируются)
    location ~ ^/(forgot-password|reset-password|dashboard|profile|edit|admin|oauth)($|/) {
        try_files $uri /spa-index.html =404;
        add_header Cache-Control "no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Неизвестные пути — строгий 404 (не даём Яндексу индексировать мусор)
    location / {
        try_files $uri =404;
        add_header Cache-Control "no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # API-прокси на бэкенд (включая WebSocket для live-функций)
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;
    }

    # Swagger-документация
    location /documentation/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Health check
    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # Uptime Kuma — мониторинг (отдельный сервис на сервере)
    location /kuma/ {
        proxy_pass http://uptime-kuma:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    access_log /var/log/nginx/bookstrata-access.log;
    error_log  /var/log/nginx/bookstrata-error.log warn;
}
