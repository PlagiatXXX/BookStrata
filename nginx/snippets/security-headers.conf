# ============================================================
# Security-заголовки — общий snippet для всех location
# ============================================================
# Почему include, а не наследование:
# В Nginx, как только в location появляется свой add_header,
# ВСЕ add_header из server-блока перестают наследоваться.
# Поэтому в server мы задаём только default, а в каждом location
# со своим Cache-Control делаем include этого файла — иначе статики
# (JS/изображения/видео/assets) уходила бы без nosniff/HSTS.
# ============================================================

# ———— HSTS (1 год, preload) ————
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# ———— Защита от clickjacking ————
add_header X-Frame-Options "DENY" always;

# ———— Защита от MIME-sniffing ————
add_header X-Content-Type-Options "nosniff" always;

# ———— Referrer-Policy ————
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ———— COOP (OAuth-попапы: Яндекс, TG, Google) ————
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

# ———— Permissions Policy ————
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# ———— Content-Security-Policy (фронт) ————
# Одна строка — HTTP/2 не допускает CR/LF в значениях заголовков.
# frame-ancestors не работает в meta-теге, поэтому CSP только здесь.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://smartcaptcha.yandexcloud.net https://mc.yandex.ru https://yastatic.net https://cdn.jsdelivr.net https://www.googletagmanager.com https://www.google-analytics.com https://ssl.google-analytics.com https://tagmanager.google.com; style-src 'self' 'unsafe-inline' https://smartcaptcha.yandexcloud.net https://cdn.jsdelivr.net https://tagmanager.google.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; frame-src https://smartcaptcha.yandexcloud.net https://mc.yandex.ru https://www.googletagmanager.com; frame-ancestors 'none'; connect-src 'self' https://smartcaptcha.yandexcloud.net https://api.telegram.org https://mc.yandex.ru wss://mc.yandex.ru https://*.ingest.sentry.io https://*.ingest.de.sentry.io https://s3.twcstorage.ru https://*.cdn.twcstorage.ru https://cdn.jsdelivr.net https://www.transparenttextures.com https://*.google-analytics.com https://*.analytics.google.com https://*.g.doubleclick.net; worker-src 'self' blob:;" always;
