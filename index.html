<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover" />
    <meta name="description" content="BookStrata — твоё книжное пространство. Создавайте тир-листы, ведите личную библиотеку, находите книги по вкусу с ИИ и делитесь впечатлениями." />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Google Tag Manager (буферизация dataLayer сразу, загрузка скрипта отложена до интеракции/idle) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      if (/^(www\.)?bookstrata\.ru$/.test(location.hostname) && !window.__PRERENDER__) {
        function loadGTM() {
          if (window._gtmLoaded) return;
          window._gtmLoaded = true;
          window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
          var f = document.getElementsByTagName('script')[0];
          var j = document.createElement('script');
          j.async = true;
          j.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-58N9H6KR';
          f.parentNode.insertBefore(j, f);
        }
        var gtmEvents = ['scroll', 'keydown', 'touchstart', 'click'];
        function onGtmInteract() {
          gtmEvents.forEach(function(e) { window.removeEventListener(e, onGtmInteract); });
          loadGTM();
        }
        gtmEvents.forEach(function(e) { window.addEventListener(e, onGtmInteract, { once: true, passive: true }); });
        if ('requestIdleCallback' in window) {
          requestIdleCallback(function() { setTimeout(loadGTM, 4000); });
        } else {
          setTimeout(loadGTM, 4500);
        }
      }
    </script>
    <!-- End Google Tag Manager -->

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="msapplication-TileColor" content="#0a0a0a" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BookStrata" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="telegram:channel" content="@bookstrata" />
    <!-- Preload критических шрифтов (hero lCP) -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/montserrat-cyrillic.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/onest-cyrillic.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/manrope-cyrillic.woff2" crossorigin />
    <!-- Self-hosted fonts (кэшируемый CSS для всех гарнитур сайта) -->
    <link rel="stylesheet" href="/fonts.css" />

    <!-- Inline critical CSS — лоадер до гидратации React -->
    <style>
      #root-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #0b1620;
        color: #94a3b8;
        font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
        padding: 1rem;
      }
      #root-loader .loader-logo {
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #d94f2b;
        margin-bottom: 1.5rem;
      }
      #root-loader .loader-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(217, 79, 43, 0.2);
        border-top-color: #d94f2b;
        border-radius: 50%;
        animation: loader-spin 0.8s linear infinite;
      }
      @keyframes loader-spin {
        to { transform: rotate(360deg); }
      }
      #root-loader .loader-text {
        margin-top: 0.75rem;
        font-size: 0.8125rem;
        opacity: 0.6;
        animation: loader-pulse 1.5s ease-in-out infinite;
      }
      @keyframes loader-pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 0.3; }
      }
    </style>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-58N9H6KR"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root">
      <div id="root-loader">
        <div class="loader-logo">BookStrata</div>
        <div class="loader-spinner"></div>
        <div class="loader-text">Загрузка...</div>
      </div>
    </div>
    <script type="module" src="./src/app/main.tsx"></script>
  </body>
</html>
