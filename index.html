<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BookStrata — крупнейшая библиотека пользовательских рейтингов книг. Создавайте тир-листы, ведите личную библиотеку, находите книги по вкусу с ИИ и общайтесь с единомышленниками." />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="msapplication-TileColor" content="#0a0a0a" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BookStrata" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="telegram:channel" content="@bookstrata" />

      default-src 'self';

      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://smartcaptcha.yandexcloud.net https://cdn.jsdelivr.net;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https: blob:;
      frame-src https://smartcaptcha.yandexcloud.net https://mc.yandex.ru;
      connect-src 'self' https://smartcaptcha.yandexcloud.net https://api.telegram.org https://mc.yandex.ru wss://mc.yandex.ru https://*.ingest.sentry.io https://*.ingest.de.sentry.io https://s3.twcstorage.ru https://*.cdn.twcstorage.ru https://fonts.gstatic.com https://eu.i.posthog.com https://eu-assets.i.posthog.com wss://eu-assets.i.posthog.com https://cdn.jsdelivr.net https://www.transparenttextures.com;
      worker-src 'self' blob:;
    ">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://re406cj9uj.cdn.twcstorage.ru" />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Space+Grotesk:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Space+Grotesk:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'; this.onload=null;" crossorigin="anonymous" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Space+Grotesk:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" crossorigin="anonymous" /></noscript>

    <!-- Cookie Consent styles — загружается асинхронно через JS -->
    <style>
      #cc-main {
        --cc-bg: #0f172a;
        --cc-primary-color: #f1f5f9;
        --cc-secondary-color: #94a3b8;

        --cc-btn-primary-bg: #d94f2b;
        --cc-btn-primary-color: #fff;
        --cc-btn-primary-hover-bg: #c04020;
        --cc-btn-primary-border-color: transparent;

        --cc-btn-secondary-bg: #1e293b;
        --cc-btn-secondary-color: #cbd5e1;
        --cc-btn-secondary-hover-bg: #334155;
        --cc-btn-secondary-border-color: transparent;

        --cc-separator-border-color: #1e293b;

        --cc-toggle-on-bg: #d94f2b;
        --cc-toggle-off-bg: #475569;
        --cc-toggle-on-knob-bg: #fff;
        --cc-toggle-off-knob-bg: #94a3b8;

        --cc-checkbox-category-bg: #1e293b;
        --cc-checkbox-category-border: #475569;
        --cc-checkbox-category-checked-bg: #d94f2b;
        --cc-checkbox-category-checked-border: #d94f2b;
        --cc-checkbox-category-checked-color: #fff;

        --cc-cookie-category-block-bg: #1e293b;
        --cc-cookie-category-block-border: #334155;
        --cc-cookie-category-block-hover-bg: #0f172a;
        --cc-cookie-category-block-hover-border: #475569;
        --cc-cookie-category-block-expanded-bg: #0f172a;
        --cc-cookie-category-block-expanded-border: #475569;
        --cc-cookie-category-description-text: #94a3b8;

        --cc-overlay-bg: rgba(0, 0, 0, 0.65);

        --cc-footer-bg: #0b0f1f;
        --cc-footer-color: #64748b;
        --cc-footer-border-color: #1e293b;
        --cc-footer-hover-color: #d94f2b;

        --cc-consent-modal-box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);

        font-family: "Manrope", system-ui, -apple-system, sans-serif;
      }

      /* ── Consent modal ── */
      #cc-main .cm__dialog {
        max-width: 440px;
        border: 1px solid rgba(217, 79, 43, 0.15);
        border-radius: 16px;
        box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(217, 79, 43, 0.08);
        animation: cm-scale-in 0.25s ease-out;
      }

      @keyframes cm-scale-in {
        from {
          opacity: 0;
          transform: scale(0.92) translateY(8px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      #cc-main .cm__title {
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #f1f5f9;
      }

      #cc-main .cm__desc {
        font-size: 0.875rem;
        line-height: 1.6;
        color: #94a3b8;
      }

      #cc-main .cm__btn {
        border-radius: 10px;
        font-weight: 600;
        font-size: 0.875rem;
        padding: 0.625rem 1.25rem;
        transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      }

      #cc-main .cm__btn--primary {
        background: linear-gradient(135deg, #d94f2b 0%, #c04020 100%);
        box-shadow: 0 4px 14px rgba(217, 79, 43, 0.35);
      }
      #cc-main .cm__btn--primary:hover {
        background: linear-gradient(135deg, #e05a35 0%, #c94524 100%);
        box-shadow: 0 6px 20px rgba(217, 79, 43, 0.45);
      }

      #cc-main .cm__btn--secondary {
        background: #1e293b;
        border: 1px solid rgba(148, 163, 184, 0.12);
      }
      #cc-main .cm__btn--secondary:hover {
        background: #293548;
        border-color: rgba(148, 163, 184, 0.2);
      }

      #cc-main .cm__footer {
        padding: 1rem 1.5rem 1.5rem;
      }

      /* ── Preferences modal ── */
      #cc-main .pm__dialog {
        border-radius: 16px;
        border: 1px solid rgba(217, 79, 43, 0.10);
        box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6);
      }

      #cc-main .pm__header {
        padding: 1.5rem 1.5rem 0.75rem;
      }
      #cc-main .pm__title {
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      #cc-main .pm__desc {
        font-size: 0.8125rem;
        color: #64748b;
      }

      #cc-main .pm__section {
        border-radius: 10px;
        margin: 0 1.25rem 0.5rem;
      }
      #cc-main .pm__section-title {
        font-size: 0.875rem;
        font-weight: 600;
      }
      #cc-main .pm__section-desc {
        font-size: 0.8125rem;
      }

      #cc-main .pm__btn {
        border-radius: 10px;
        font-weight: 600;
        font-size: 0.8125rem;
        transition: background 0.2s ease;
      }
      #cc-main .pm__btn--primary {
        background: linear-gradient(135deg, #d94f2b 0%, #c04020 100%);
        box-shadow: 0 4px 14px rgba(217, 79, 43, 0.3);
      }

      #cc-main .pm__section-arrow svg {
        stroke: #94a3b8;
      }

      #cc-main .pm__footer {
        padding: 0.75rem 1.5rem 1.5rem;
      }

      /* ── Overlay ── */
      #cc-main .cc--anim .cm__overlay,
      #cc-main .cc--anim .pm__overlay {
        animation: cm-fade-in 0.2s ease-out;
      }
      @keyframes cm-fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>

    <!-- Inline critical CSS — первый экран (лоадер + nav + hero) не ждёт внешних стилей -->
    <style>
      /* ===== Root loader — пока React не загрузился ===== */
      #root-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #0b1620;
        color: #94a3b8;
        font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
        padding: 1rem;
      }
      #root-loader .loader-logo {
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #d94f2b;
        margin-bottom: 1.5rem;
      }
      #root-loader .loader-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(217, 79, 43, 0.2);
        border-top-color: #d94f2b;
        border-radius: 50%;
        animation: loader-spin 0.8s linear infinite;
      }
      @keyframes loader-spin {
        to { transform: rotate(360deg); }
      }
      #root-loader .loader-text {
        margin-top: 0.75rem;
        font-size: 0.8125rem;
        opacity: 0.6;
        animation: loader-pulse 1.5s ease-in-out infinite;
      }
      @keyframes loader-pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 0.3; }
      }

      /* ===== Landing page — первый экран (без CSS-файлов) ===== */
      :root {
        --accent-main: #d94f2b;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      }
      .landing-page {
        background: #0b1620;
        color: #e2e8f0;
        overflow-x: hidden;
        font-family: "Manrope", system-ui, sans-serif;
      }
      /* Nav */
      .landing-nav {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 100;
        padding: 16px 24px;
        background: rgba(11,22,32,0.6);
        backdrop-filter: blur(20px) saturate(1.5);
        -webkit-backdrop-filter: blur(20px) saturate(1.5);
        border-bottom: 1px solid rgba(255,255,255,0.06);
      }
      .landing-nav__inner {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .landing-nav__links { display: flex; align-items: center; gap: 8px; }
      .landing-nav__link {
        background: none; border: none;
        padding: 8px 16px; font-size: 14px; font-weight: 500;
        color: #94a3b8; cursor: pointer; border-radius: 8px;
        font-family: "Manrope", system-ui, sans-serif;
      }
      .landing-nav__auth { display: flex; align-items: center; gap: 8px; margin-left: 8px; }
      .landing-nav__cta {
        padding: 8px 20px; border: none; border-radius: 10px;
        font-size: 14px; font-weight: 600; cursor: pointer;
        font-family: "Manrope", system-ui, sans-serif; white-space: nowrap;
      }
      .landing-nav__cta--primary { background: var(--accent-main); color: #fff; }
      .landing-nav__burger { display: none; background: none; border: none; color: #e2e8f0; cursor: pointer; padding: 4px; }

      /* Hero */
      .landing-hero {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: 120px 24px 80px;
      }
      .landing-hero__video {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover; opacity: 0.4;
      }
      .landing-hero__gradient {
        position: absolute; inset: 0; z-index: 1;
        background: linear-gradient(180deg, rgba(11,22,32,0.1) 0%, rgba(11,22,32,0.5) 40%, rgba(11,22,32,0.95) 80%, #0b1620 100%);
      }
      .landing-hero__pattern {
        position: absolute; inset: 0; z-index: 1;
        background-image:
          radial-gradient(circle at 20% 50%, rgba(6,188,249,0.08) 0%, transparent 50%),
          radial-gradient(circle at 80% 20%, rgba(168,85,247,0.06) 0%, transparent 50%),
          radial-gradient(circle at 50% 80%, rgba(6,188,249,0.04) 0%, transparent 50%);
      }
      .landing-hero__content { position: relative; z-index: 2; text-align: center; max-width: 720px; }
      .landing-hero__badge {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 6px 16px; border-radius: 100px;
        background: rgba(6,188,249,0.1);
        border: 1px solid rgba(6,188,249,0.2);
        font-size: 13px; font-weight: 500; color: #06bcf9;
        margin-bottom: 28px;
        animation: fadeIn 0.6s ease-out;
      }
      .landing-hero__title {
        font-family: "Space Grotesk", sans-serif;
        font-size: clamp(2rem, 4.5vw, 3.25rem);
        font-weight: 800; line-height: 1.15;
        letter-spacing: -0.03em; color: #f1f5f9;
        margin-bottom: 20px;
        animation: slideUp 0.6s ease-out 0.1s both;
      }
      .landing-hero__gradient-text {
        background: linear-gradient(135deg, #06bcf9, #a855f7, #06bcf9);
        background-size: 200% auto;
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: shimmer 3s linear infinite;
      }
      .landing-hero__subtitle {
        font-size: clamp(1rem, 2vw, 1.25rem);
        line-height: 1.7; color: #94a3b8;
        max-width: 560px; margin: 0 auto 36px;
        animation: slideUp 0.6s ease-out 0.2s both;
      }
      .landing-hero__actions {
        display: flex; align-items: center; justify-content: center;
        gap: 12px; flex-wrap: wrap;
        animation: slideUp 0.6s ease-out 0.3s both;
      }
      .landing-hero__btn {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 14px 28px; border-radius: 12px;
        font-size: 15px; font-weight: 600; cursor: pointer;
        border: none; font-family: "Manrope", system-ui, sans-serif;
      }
      .landing-hero__btn--primary { background: var(--accent-main); color: #fff; box-shadow: 0 4px 24px rgba(217,79,43,0.3); }
      .landing-hero__btn--secondary {
        background: rgba(255,255,255,0.06); color: #e2e8f0;
        border: 1px solid rgba(255,255,255,0.1);
        backdrop-filter: blur(12px);
      }

      /* Mockup (desktop only) */
      .landing-hero__mockup { position: absolute; right: -80px; bottom: 40px; z-index: 2; opacity: 0.3; transform: rotate(-3deg) scale(0.85); pointer-events: none; }
      .landing-hero__mockup-inner { width: 280px; background: rgba(15,25,40,0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 16px; box-shadow: 0 24px 80px rgba(0,0,0,0.5); }
      .landing-hero__mockup-bar { display: flex; gap: 6px; margin-bottom: 14px; }
      .landing-hero__mockup-bar span { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2); }
      .landing-hero__mockup-bar span:first-child { background: #ef4444; }
      .landing-hero__mockup-bar span:nth-child(2) { background: #eab308; }
      .landing-hero__mockup-bar span:nth-child(3) { background: #22c55e; }
      .landing-hero__mockup-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
      .landing-hero__mockup-tier { width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #fff; background: linear-gradient(135deg, #06bcf9, #a855f7); flex-shrink: 0; }
      .landing-hero__mockup-books { display: flex; gap: 6px; flex: 1; }
      .landing-hero__mockup-book { height: 40px; border-radius: 4px; flex: 1; background: linear-gradient(135deg, rgba(6,188,249,0.3), rgba(168,85,247,0.2)); }

      /* Keyframes */
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

      /* Mobile overrides для hero */
      @media (max-width: 768px) {
        .landing-nav__links { display: none; }
        .landing-nav__burger { display: block; }
        .landing-hero { min-height: 70vh; padding: 80px 16px 24px; }
        .landing-hero__mockup { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="root-loader">
        <div class="loader-logo">BookStrata</div>
        <div class="loader-spinner"></div>
        <div class="loader-text">Загрузка...</div>
      </div>
    </div>
    <script type="module" src="./src/app/main.tsx"></script>
  </body>
</html>
